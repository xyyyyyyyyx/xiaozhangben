# NOTE: Java .properties files are read as ISO-8859-1 (not UTF-8), so keep all
# comments and values in this file ASCII-only.

# Java here is extremely slow over IPv6, so force IPv4 for the Gradle daemon.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Room 2.6.x is incompatible with KSP2, so keep KSP1.
ksp.useKSP2=false

# The Gradle JVM is deliberately NOT pinned here, so the path stays machine-local
# and this file can be committed. If Android Studio ships a JDK newer than Gradle
# supports (JBR 25 vs Gradle 8.11.1), do one of:
#   * Settings > Build Tools > Gradle > Gradle JDK: pick a JDK 17, or
#   * add org.gradle.java.home=<path to your jdk-17> to ~/.gradle/gradle.properties